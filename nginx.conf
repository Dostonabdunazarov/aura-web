server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # NB: no gzip here on purpose. On-the-fly gzip makes nginx stream large
    # assets with Transfer-Encoding: chunked, which the upstream Caddy proxy
    # mishandles (empty body / Content-Length: 0). Compression is handled at
    # the edge (Caddy / Cloudflare); nginx serves files verbatim with a real
    # Content-Length.

    # Hashed assets (Vite emits content-hashed filenames) — cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA history fallback — every route returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached (so deploys take effect).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
